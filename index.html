<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Todo</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    .row { display: flex; gap: 8px;}
    input { flex: 1; padding: 10px; font-size: 14px; }
    button { padding: 10px 12px; font-size: 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 16px 0 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 8px; }
    li.done span { text-decoration: line-through; opacity: 0.6; }
    li span { flex: 1; }
    .small { font-size: 12px; opacity: 0.7; margin-top: 10px; color:blue; }
  </style>
</head>
<body>
  <h1>Todo</h1>

  <div class="row">
    <input id="todoInput" placeholder="Add a task..." autocomplete="off" />
    <button id="addBtn">Add</button>
  </div>

  <ul id="list"></ul>

  <div class="small">Tip: click a task to mark done. Delete removes it. Saved in your browser.</div>

  <script>
    const input = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("list");

    const STORAGE_KEY = "simple_todos_v1";
    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";
      todos.forEach((t, idx) => {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const text = document.createElement("span");
        text.textContent = t.text;

        const del = document.createElement("button");
        del.textContent = "Delete";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          todos.splice(idx, 1);
          save();
          render();
        });

        li.addEventListener("click", () => {
          t.done = !t.done;
          save();
          render();
        });

        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    }

    addBtn.addEventListener("click", addTodo);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
