<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Bottom-left block (blue/teal) -->
  <rect x="8" y="72" width="28" height="28" rx="4" fill="#5AB4C5"/>
  <rect x="8" y="72" width="28" height="10" rx="4" fill="#3A9DB0"/>
  <!-- Studs on bottom-left -->
  <circle cx="17" cy="72" r="3.5" fill="#3A9DB0"/>
  <circle cx="31" cy="72" r="3.5" fill="#3A9DB0"/>

  <!-- Bottom-center block (green) -->
  <rect x="38" y="72" width="28" height="28" rx="4" fill="#6DC067"/>
  <rect x="38" y="72" width="28" height="10" rx="4" fill="#4FAA49"/>
  <!-- Studs on bottom-center -->
  <circle cx="47" cy="72" r="3.5" fill="#4FAA49"/>
  <circle cx="61" cy="72" r="3.5" fill="#4FAA49"/>

  <!-- Middle-center block (amber/yellow) -->
  <rect x="38" y="44" width="28" height="28" rx="4" fill="#F5C542"/>
  <rect x="38" y="44" width="28" height="10" rx="4" fill="#E0AD2B"/>
  <!-- Studs on middle-center -->
  <circle cx="47" cy="44" r="3.5" fill="#E0AD2B"/>
  <circle cx="61" cy="44" r="3.5" fill="#E0AD2B"/>

  <!-- Middle-right block (green) -->
  <rect x="68" y="44" width="28" height="28" rx="4" fill="#5DBB57"/>
  <rect x="68" y="44" width="28" height="10" rx="4" fill="#45A03F"/>
  <!-- Studs on middle-right -->
  <circle cx="77" cy="44" r="3.5" fill="#45A03F"/>
  <circle cx="91" cy="44" r="3.5" fill="#45A03F"/>

  <!-- Bottom-right block (yellow) -->
  <rect x="68" y="72" width="28" height="28" rx="4" fill="#F5C542"/>
  <rect x="68" y="72" width="28" height="10" rx="4" fill="#E0AD2B"/>
  <!-- Studs on bottom-right -->
  <circle cx="77" cy="72" r="3.5" fill="#E0AD2B"/>
  <circle cx="91" cy="72" r="3.5" fill="#E0AD2B"/>

  <!-- Top-right block (teal - tallest) -->
  <rect x="68" y="16" width="28" height="28" rx="4" fill="#3A9DB0"/>
  <rect x="68" y="16" width="28" height="10" rx="4" fill="#2B8799"/>
  <!-- Studs on top-right -->
  <circle cx="77" cy="16" r="3.5" fill="#2B8799"/>
  <circle cx="91" cy="16" r="3.5" fill="#2B8799"/>

  <!-- Graduation cap on top -->
  <polygon points="82,6 68,14 82,18 96,14" fill="#1B5E6B"/>
  <polygon points="82,6 82,18 96,14" fill="#134E4A"/>
  <!-- Tassel -->
  <line x1="96" y1="14" x2="100" y2="22" stroke="#F5C542" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="100" cy="23" r="2" fill="#F5C542"/>

  <!-- Code braces {_} on top block -->
  <text x="82" y="34" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#cffafe">{_}</text>

  <!-- Sparkle lines above cap -->
  <line x1="82" y1="0" x2="82" y2="4" stroke="#5AB4C5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="76" y1="2" x2="78" y2="5" stroke="#5AB4C5" stroke-width="1" stroke-linecap="round"/>
  <line x1="88" y1="2" x2="86" y2="5" stroke="#5AB4C5" stroke-width="1" stroke-linecap="round"/>
</svg>
